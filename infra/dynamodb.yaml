AWSTemplateFormatVersion: '2010-09-09'
Description: Headwins Poker checkpoints and permanent poker history with fixed provisioned capacity.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    ref: [../docs/architecture.md]
Resources:
  GameTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: One compressed checkpoint keeps the shared game update atomic and storage bounded.
        must:
          - Keep provisioned capacity fixed; do not enable autoscaling or paid backups for this setup.
          - Only the backend may access private checkpoints.
    Properties:
      TableName: !Sub '${AWS::StackName}-game'
      BillingMode: PROVISIONED
      TableClass: STANDARD
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      DeletionProtectionEnabled: true
      # The default AWS-owned key encrypts data at rest without KMS key charges.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: headwins-poker
  HistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Permanent private events and player results grow independently of the recovery checkpoint.
        must:
          - Commit history and checkpoints together through DynamoDB transactions.
          - Only backend and authorized offline analysis may read private cards.
          - Retain history indefinitely without TTL; preserve fixed capacity without autoscaling.
        gaps: Paid point-in-time recovery is disabled to preserve the existing budget-conscious setup.
    Properties:
      TableName: !Sub '${AWS::StackName}-history'
      BillingMode: PROVISIONED
      TableClass: STANDARD
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 20
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: headwins-poker
Outputs:
  HistoryTableName:
    Description: Backend DYNAMODB_HISTORY_TABLE setting
    Value: !Ref HistoryTable
  HistoryTableArn:
    Description: Scope backend history GetItem and PutItem and offline Query permissions to this ARN
    Value: !GetAtt HistoryTable.Arn
  TableName:
    Description: Backend DYNAMODB_TABLE setting
    Value: !Ref GameTable
  TableArn:
    Description: Scope backend dynamodb GetItem and PutItem permissions to this ARN
    Value: !GetAtt GameTable.Arn
