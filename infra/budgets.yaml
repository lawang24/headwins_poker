AWSTemplateFormatVersion: '2010-09-09'
Description: Headwins Poker monthly cost alerts; notifications do not cap or stop spending.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
Parameters:
  AlertEmail:
    Type: String
    Description: Email recipient for project and DynamoDB cost alerts
Resources:
  ProjectBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-project'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 0.01, Unit: USD}
        CostFilters:
          TagKeyValue: ['user:Project$headwins-poker']
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
  DynamoDBBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-dynamodb'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 0.01, Unit: USD}
        CostFilters:
          Service: [Amazon DynamoDB]
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
